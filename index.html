<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Draw</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Caveat:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <div class="start-content">
            <h1 class="game-title">SPEED<br>DRAW</h1>
            <div class="pencil-icon">✏️</div>
            <button id="start-btn" class="start-button">START</button>
            <div class="highscore-display">
                <span class="highscore-label">HIGH SCORE</span>
                <span id="highscore" class="highscore-value">0</span>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="notebook-page" id="notebook-page">
            <div class="page-content">
                <div class="game-header">
                    <div class="score-display">
                        <span class="label">SCORE</span>
                        <span id="current-score" class="value">0</span>
                    </div>
                    <div class="timer-display">
                        <span class="label">TIME</span>
                        <span id="timer" class="value timer-value">10.0</span>
                    </div>
                </div>
                
                <div class="prompt-section">
                    <span class="draw-label">DRAW:</span>
                    <span id="shape-prompt" class="shape-name">Square</span>
                    <div class="hint-text">Click to place points · <span id="point-hint">4+ points</span></div>
                </div>

                <div class="canvas-container">
                    <canvas id="drawing-canvas"></canvas>
                </div>

                <div class="button-row">
                    <button id="undo-btn" class="game-button undo-button">UNDO</button>
                    <button id="clear-btn" class="game-button clear-button">CLEAR</button>
                    <button id="submit-btn" class="game-button submit-button">SUBMIT</button>
                </div>
            </div>
            <div class="page-lines"></div>
        </div>

        <!-- Page turn overlay -->
        <div id="page-turn" class="page-turn">
            <div class="page-turn-front"></div>
            <div class="page-turn-back"></div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen">
        <div class="gameover-content">
            <h2 class="gameover-title">GAME OVER!</h2>
            <div class="final-score-section">
                <span class="final-label">YOUR SCORE</span>
                <span id="final-score" class="final-value">0</span>
            </div>
            <div class="final-score-section">
                <span class="final-label">HIGH SCORE</span>
                <span id="final-highscore" class="final-value">0</span>
            </div>
            <div id="new-record" class="new-record" style="display: none;">🎉 NEW RECORD! 🎉</div>
            <button id="restart-btn" class="start-button">PLAY AGAIN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
